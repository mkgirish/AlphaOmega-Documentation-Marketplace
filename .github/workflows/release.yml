# Generated from the release check’s contract — never edited by hand (rule 27).
name: release
on:
  workflow_dispatch:
jobs:
  release:
    # Builds every compose image, records each digest and software bill of materials, and uploads the docker-saved bundle a person deploys by hand.
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: anchore/sbom-action/download-syft@v0
      - run: docker compose build
        continue-on-error: true
      - run: npm run release:manifest
        if: always()
      - run: docker save $(docker compose config --images) | gzip > release-images.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-manifest
          path: release.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-images
          path: release-images.tar.gz
          if-no-files-found: error
